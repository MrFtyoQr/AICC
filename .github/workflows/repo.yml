name: repo

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: repo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # gitleaks lista los commits del PR

jobs:
  secrets:
    name: secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backlog:
    name: backlog coherente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerar backlog y comprobar que está al día
        run: |
          python -I scripts/generar-backlog-jira.py
          git diff --exit-code -- docs/planning/jira/backlog.csv \
            || (echo "backlog.csv desactualizado: ejecuta scripts/generar-backlog-jira.py" && exit 1)
