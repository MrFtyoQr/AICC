name: backend

on:
  pull_request:
    paths: ["backend/**", "shared/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "shared/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicc
          POSTGRES_USER: aicc
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aicc -d aicc"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://aicc:ci_only_password@127.0.0.1:5432/aicc
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias (exactas de uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Migraciones
        run: uv run alembic upgrade head
      - name: Pruebas (incluye integración y aislamiento)
        run: uv run pytest -q
      - name: Contrato OpenAPI al día
        run: uv run python scripts/export_openapi.py --check
